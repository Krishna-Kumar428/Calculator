<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <input type="text" placeholder="0" id="input">
        <div class="first-line space">
            <button class="green">AC</button>
            <button class="green">DEL</button>
            <button class="green">%</button>
            <button class="green">/</button>
        </div>

        <div class="first-line">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="green">*</button>
        </div>

        <div class="first-line">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="green">-</button>
        </div>

        <div class="first-line">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="green">+</button>
        </div>

        <div class="first-line">
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="gold">=</button>
        </div>
    </div>
</body>
</html>
